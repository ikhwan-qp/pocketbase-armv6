name: Build PocketBase

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'version'

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Export version to variable
        id: get-version
        shell: bash
        run: |
          if [ ! -f version ]; then
            echo "Error: version file not found." >&2
            exit 1
          fi
          VERSION=$(cat version)
          echo "POCKETBASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clone PocketBase
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ env.POCKETBASE_VERSION }}" https://ganigeorgiev.com/git/pocketbase/pocketbase pocketbase

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'pocketbase/go.mod'
          cache: true
          cache-dependency-path: 'pocketbase/go.sum'

      - name: Build PocketBase
        shell: bash
        working-directory: pocketbase/examples/base
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 6
          CGO_ENABLED: 0
        run: |
          ARTIFACT_DIR="../../built_artifacts"
          mkdir -p $ARTIFACT_DIR

          go build -ldflags="-s -w -X 'ganigeorgiev.com/pocketbase/pocketbase.Version=${{ env.POCKETBASE_VERSION }}-armv6'" -o $ARTIFACT_DIR/pocketbase

      - name: Package to TAR.GZ & Checksum
        shell: bash
        working-directory: pocketbase/built_artifacts
        run: |
          TAR_NAME="pocketbase_${{ env.POCKETBASE_VERSION }}_linux_armv6.tar.gz"
          tar --owner=0 --group=0 -czf "$TAR_NAME" pocketbase
          rm pocketbase
          
          shasum -a 256 -b *.tar.gz > .checksum.txt
          cat .checksum.txt

      - name: Generate artifact attestation
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: 'pocketbase/built_artifacts/pocketbase_${{ env.POCKETBASE_VERSION }}_linux_armv6.tar.gz'

      - name: Create release notes
        shell: bash
        working-directory: pocketbase/built_artifacts
        run: |
          ATTEST_URL="${{ steps.attest.outputs.attestation-url }}"
          
          cat << EOF > .release-notes.md
          Verify that the release artifacts were built from source by GitHub. You can use the [GitHub CLI] to [verify] their integrity and provenance using the cryptographically [signed attestations].

          \`\`\`sh
          gh attestation verify pocketbase_${{ env.POCKETBASE_VERSION }}_linux_armv6.tar.gz -R $GITHUB_REPOSITORY
          \`\`\`

          SHA256 Checksums:

          \`\`\`
          $(cat .checksum.txt)
          \`\`\`

          [GitHub CLI]: https://cli.github.com/
          [verify]: https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds
          [signed attestations]: ${ATTEST_URL}
          EOF

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.POCKETBASE_VERSION }}
          tag: ${{ env.POCKETBASE_VERSION }}
          makeLatest: true
          bodyFile: 'pocketbase/built_artifacts/.release-notes.md'
          artifacts: 'pocketbase/built_artifacts/pocketbase*.tar.gz'