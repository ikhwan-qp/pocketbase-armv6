name: Check latest PocketBase version

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: check
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the latest version of PocketBase
        id: get-version
        run: |
          LATEST_VERSION=$(curl -s "https://ganigeorgiev.com/api/collections/releases/records?filter=channel.repository.name%3D%22pocketbase%22%20%26%26%20channel.name%3D%22default%22&sort=-semver&skipTotal=1&perPage=1" | jq -r '.items[0].tag')
          
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" == "null" ]; then
            echo "Error: Failed to fetch version" >&2
            exit 1
          fi

          echo "$LATEST_VERSION" > version
          echo "POCKETBASE_VERSION=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check-changes
        run: |
          git diff --quiet version || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit & Push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version
          git commit -m "Version updated to: ${{ steps.get-version.outputs.POCKETBASE_VERSION }}"
          git push